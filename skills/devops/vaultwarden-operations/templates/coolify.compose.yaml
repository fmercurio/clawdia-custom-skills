# Portable non-secret candidate; NOT apply authorization.
# Verify the exact image contract, encrypted mount and ownership before use.
# Values belong in approved operator-local configuration, not this repository.
services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:?set reviewed official version and digest}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -ec
      - test -f /data/.vaultwarden-volume-ready && exec /start.sh
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:?set approved canonical HTTPS origin}
      DATA_FOLDER: /data
      ENV_FILE: /dev/null
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "8080"
      SIGNUPS_ALLOWED: "false"
      SIGNUPS_DOMAINS_WHITELIST: ""
      INVITATIONS_ALLOWED: "false"
      LOG_LEVEL: warn
      EXTENDED_LOGGING: "false"
    volumes:
      - type: bind
        source: ${VAULTWARDEN_DATA_PATH:?set verified encrypted mounted data root}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,mode=1777
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 128
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
