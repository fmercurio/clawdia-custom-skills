  - name: caprover-operations
    status: candidate
    version: 0.1.0
    category: devops
    description: Guarded read-only CapRover CLI session diagnosis and explicit operational gates for safe configuration,
      rollback, scaling and retirement.
    source:
      type: internal
      origin: Original reauthoring from an authorized public specification and official CapRover CLI/API references
      author: ClawdIA contributors
      created: '2026-09-15'
      approved: null
      approved_by: null
      repository_url: null
      no_repository_reason: Original internal skill, not imported from a third-party skill package; immutable
        official dependency references and licenses are recorded in references/provenance.md
    installation:
      runtime_path: null
      repo_path: skills/devops/caprover-operations/
      installed_date: null
      installed_by: null
      note: Repo-only candidate; source acceptance does not authorize installation, login renewal or server operations.
    audit:
      security_review: '2026-09-15'
      security_status: passed
      findings:
      - 83 local unit and actual official-CLI fixture tests passed without skips; synthetic credentials only,
        no live CapRover session.
      - Timeout cleanup fixture covers controlled CLI cold start and an observed in-flight request held until
        teardown; process cleanup and absence of further requests are asserted.
      - Protected exact alias/origin binding, selected-session snapshot, request-time guard and pinned official
        CLI/Node layout.
      - Unexpected public exceptions become fixed inconclusive/internal_error responses; interruption and process-exit
        semantics remain distinct.
      - Both descriptor-bound source witnesses are rechecked read-only after the query; source changes dominate
        authentication evidence as inconclusive/source_changed without redirect or restoration.
      - Login, writes, redirects, unexpected destinations, environment pollution and unknown schemas fail closed;
        output excludes raw payloads and credentials.
      - Explicit current sufficient grants may be reused only within scope; credential access never authorizes
        deployment, restart or deletion.
      - Guard is a narrow interlock for trusted code, not an OS sandbox, continuous source monitor or proof of
        application health.
      frontmatter_valid: true
      company_agnostic: true
      pitfalls_documented: true
