name: Catalog and Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  catalog-validation:
    name: Skills Catalog Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install, verify, and run actionlint 1.7.12
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_LINUX_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_LINUX_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          actionlint_dir="$RUNNER_TEMP/actionlint-1.7.12"
          actionlint="$actionlint_dir/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --show-error --location --output "$archive" "$ACTIONLINT_LINUX_URL"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$actionlint_dir" actionlint
          test -x "$actionlint"
          actionlint_version="$("$actionlint" -version | sed -n '1p')"
          test "$actionlint_version" = "$ACTIONLINT_VERSION"
          "$actionlint" -oneline -shellcheck= -pyflakes=
          printf '%s\n' "$actionlint_dir" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository tooling unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Run llm-wiki staging validator tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest skills/research/llm-wiki/tests/test_validate_staging.py -v

      - name: Run declarative skill deployment planner tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/skill_deploy/tests -p "test_*.py" -v

      - name: Verify generated catalog is up to date
        run: python3 tools/generate_catalog.py --check

      - name: Validate all tracked SKILL.md files
        shell: bash
        run: |
          while IFS= read -r -d '' path; do
            python3 tools/validate_skill.py "$path"
          done < <(git ls-files -z '*SKILL.md')
