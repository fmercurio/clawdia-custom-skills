name: Catalog and Validation

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-gates:
    name: Public catalog gate (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate:
          - schema-fixtures
          - deterministic-generation
          - generated-drift
          - stable-preview
          - artifact-checksums
          - skill-contract
          - unit-contract
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Bootstrap declared test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run public catalog gate
        run: python3 -B tools/run_catalog_ci.py --gate ${{ matrix.gate }}

  private-clean-room:
    name: private-clean-room/UNPROVISIONED
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report missing private provisioning
        run: |
          echo 'private-clean-room/UNPROVISIONED' >&2
          exit 1

  catalog-validation:
    name: Skills Catalog Validation
    if: ${{ always() }}
    needs:
      - public-gates
      - private-clean-room
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every catalog prerequisite
        run: |
          if [ "${{ needs.public-gates.result }}" = success ] &&
             [ "${{ needs.private-clean-room.result }}" = success ]; then
            exit 0
          fi
          exit 1
