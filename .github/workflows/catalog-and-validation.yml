name: Catalog and Validation

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-gates:
    name: Public catalog gate (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate:
          - schema-fixtures
          - deterministic-generation
          - generated-drift
          - stable-preview
          - artifact-checksums
          - skill-contract
          - unit-contract
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install, verify, and run actionlint 1.7.12
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_LINUX_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_LINUX_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          actionlint_dir="$RUNNER_TEMP/actionlint-1.7.12"
          actionlint="$actionlint_dir/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --show-error --location --output "$archive" "$ACTIONLINT_LINUX_URL"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$actionlint_dir" actionlint
          test -x "$actionlint"
          actionlint_version="$("$actionlint" -version | sed -n '1p')"
          test "$actionlint_version" = "$ACTIONLINT_VERSION"
          "$actionlint" -oneline -shellcheck= -pyflakes=
          printf '%s\n' "$actionlint_dir" >> "$GITHUB_PATH"
          printf 'ACTIONLINT_BIN=%s\n' "$actionlint" >> "$GITHUB_ENV"

      - name: Bootstrap declared test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run public catalog gate
        run: python3 -B tools/run_catalog_ci.py --gate ${{ matrix.gate }}

  private-clean-room:
    name: private-clean-room/UNPROVISIONED
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report missing private provisioning
        run: |
          echo 'private-clean-room/UNPROVISIONED' >&2
          exit 1

  catalog-validation:
    name: Skills Catalog Validation
    if: ${{ always() }}
    needs:
      - public-gates
      - private-clean-room
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every catalog prerequisite
        run: |
          if [ "${{ needs.public-gates.result }}" = success ] &&
             [ "${{ needs.private-clean-room.result }}" = success ]; then
            exit 0
          fi
          exit 1
