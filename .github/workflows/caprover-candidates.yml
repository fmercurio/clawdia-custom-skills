name: CapRover Candidate Fixtures

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  caprover-local-fixtures:
    name: CapRover Local Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is not a deployment or install runtime job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 26.7.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt pytest==9.1.1

      - name: Install official CapRover CLI in runner temp
        run: npm install --prefix "$RUNNER_TEMP/caprover-cli" --ignore-scripts --no-audit --no-fund caprover@2.4.4

      - name: Run local CapRover fixture suites
        # No real CapRover fixture variables or live secrets are permitted.
        # Tests use local loopback fixtures and synthetic token configuration only.
        env:
          CAPROVER_TEST_CLI_ROOT: ${{ runner.temp }}/caprover-cli/node_modules/caprover
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest skills/devops/caprover-operations/tests skills/devops/caprover-deploy/tests -q -o addopts=''
